module: knowledge_health
config_ids:
  - knowledge_health
decision_surface:
  - question: "知识管线是否需要手动同步？"
    metrics:
      - knowledge_health
    decision: "当 pending_items > 0 且 needs_sync=true 时，触发知识同步流水线"
  - question: "ChromaDB 中的知识条目是否与源 JSON 保持一致？"
    metrics:
      - knowledge_health
    decision: "健康度持续下降时，检查 knowledge_sync 服务日志，必要时重建索引"

module: error_patterns
config_ids:
  - error_pattern_match
decision_surface:
  - question: "历史审查中的重复错误类型是否需要架构层面修复？"
    metrics:
      - error_pattern_match
    decision: "同一错误类型出现在 ≥3 个审查中时，升级为 P1 建议并触发探测卡"
  - question: "错误模式是否集中在特定维度（如安全/性能/数据完整性）？"
    metrics:
      - error_pattern_match
    decision: "维度集中的错误模式提示该维度可能存在系统性缺陷，建议专项审查"
